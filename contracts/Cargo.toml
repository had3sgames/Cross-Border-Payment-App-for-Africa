[workspace]
resolver = "2"
members = [
    "agent-escrow",
    "dispute-resolution",
    "escrow",
    "fee-distributor",
    "kyc-attestation",
    "loyalty-token",
    "multisig-approval",
    "recurring-payments",
    "savings-vault",
]

[workspace.dependencies]
soroban-sdk = "25.3.2"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
