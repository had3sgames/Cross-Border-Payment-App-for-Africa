[package]
name = "escrow-contract"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
dispute-resolution-contract = { path = "../dispute-resolution" }
soroban-sdk = { version = "20.5.0", features = ["testutils"] }
dispute-resolution-contract = { path = "../dispute-resolution", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
